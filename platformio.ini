; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
;board_build.f_cpu = 80000000L
framework = arduino
board_build.filesystem = littlefs
lib_deps = 
	esphome/ESPAsyncWebServer-esphome@^3.1.0
	ArduinoOTA
	jandrassy/TelnetStream@^1.2.2

; Serial upload configuration (disabled)
;upload_port = COM3
;monitor_port = COM3
;upload_protocol = esptool

; OTA upload configuration
upload_protocol = espota
upload_flags =
    --port=8266
    --auth=solar123
upload_port = solar_inverter.powdersplash.com
build_flags =
    -D ARDUINO_ESP8266_RELEASE_2_7_4
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -DNDEBUG
    -D STA_SSID=${sysenv.STA_SSID}
    -D STA_PASS=${sysenv.STA_PASS}
    ; Increase watchdog timeout to 8 seconds
    -D WDT_TIMEOUT_SEC=8

[platformio]
description = A NodeMCU Based Grafana Prometheus client. Measuring battery and current data from solar systems.
